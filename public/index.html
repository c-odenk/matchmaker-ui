<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <link rel="icon" href="<%= BASE_URL %>favicon.png">
    <title>KI-Recruiting-Software für Personalberater – matchmaker.hr</title>
    <!-- Description, Canonical, Open Graph, Twitter Card und JSON-LD setzt
         src/router/head.js je Seite; das Prerendering schreibt sie ins HTML. -->
    <script>
      // Der Startzustand des Scroll-Reveals hängt an dieser Klasse. Sie wird
      // gesetzt, bevor der Body gezeichnet wird – sonst zeigt das vorgerenderte
      // HTML die Inhalte kurz an, bevor Vue sie für die Einblendung versteckt.
      // Ohne JavaScript und beim Vorrendern bleibt sie aus: dann ist alles
      // von vornherein sichtbar.
      try {
        if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches && !navigator.webdriver) {
          document.documentElement.classList.add('reveal-an')
        }
      } catch (e) { /* im Zweifel sichtbar lassen */ }
    </script>
  </head>
  <body>
    <noscript>
      <strong>matchmaker.hr benötigt JavaScript. Bitte aktivieren Sie JavaScript, um fortzufahren.</strong>
    </noscript>
    <div id="app"></div>
    <!-- built files will be auto injected -->
  </body>
</html>
