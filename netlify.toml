# Chrome für das Prerendering (Puppeteer) muss auf Netlify vor dem Build
# explizit installiert werden — der Download bei "npm install" landet in einem
# Cache-Verzeichnis, das Netlify zwischen Builds nicht aufbewahrt.
[build]
  command = "npx puppeteer browsers install chrome && npm run build"
  publish = "dist"

# Kein SPA-Fallback (/* -> /index.html 200): Jede öffentliche Seite liegt
# vorgerendert als eigene Datei vor. Unbekannte Adressen bekommen so die
# vorgerenderte 404.html mit echtem Status 404 statt der Startseite mit 200.

# Frühere Entwurfspfade zeigen dauerhaft auf die veröffentlichten Seiten.
[[redirects]]
  from = "/entwurf"
  to = "/"
  status = 301

[[redirects]]
  from = "/entwurf/*"
  to = "/:splat"
  status = 301

# Lang-Cache für gehashte Build-Assets (Dateinamen enthalten Content-Hash)
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Alte Redesign-Vorschau: bleibt erreichbar, soll aber nicht in den Index –
# sie dupliziert Inhalte der Startseite mit veralteten Angaben.
[[headers]]
  for = "/landing-preview.html"
  [headers.values]
    X-Robots-Tag = "noindex"

# Sicherheits-Header (HSTS, Clickjacking, MIME-Sniffing, Referrer)
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
