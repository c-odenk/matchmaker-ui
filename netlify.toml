# Chrome für das Prerendering (Puppeteer) muss auf Netlify vor dem Build
# explizit installiert werden — der Download bei "npm install" landet in einem
# Cache-Verzeichnis, das Netlify zwischen Builds nicht aufbewahrt.
[build]
  command = "npx puppeteer browsers install chrome && npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Lang-Cache für gehashte Build-Assets (Dateinamen enthalten Content-Hash)
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Sicherheits-Header (HSTS, Clickjacking, MIME-Sniffing, Referrer)
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
